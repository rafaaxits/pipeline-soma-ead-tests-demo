name: CI - Testes Automatizados - T6

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências 
        run: |
          pip install pytest
          pip install allure-pytest

      - name: Executar os Testes
        run: pytest -v