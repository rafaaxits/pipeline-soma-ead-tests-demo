name: CI - Testes Automatizados T10

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          pip install pytest
          pip install allure-pytest

      - name: Executar os testes
        run: pytest -v