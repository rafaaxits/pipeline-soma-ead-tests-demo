name: CI - Testes Automatizados T10

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          pip install pytest

      - name: Executar os testes
        run: pytest -v